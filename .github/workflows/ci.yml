# Build, test and pack on every push and pull request; the .nupkg and .snupkg are kept as a run artifact.
# Publishing to NuGet is a manual step from a tag (see README "Releasing") so no API key lives in this repo.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # SourceLink needs the commit history

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - run: dotnet pack RandomNameGeneratorLibrary --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: artifacts/*nupkg
          retention-days: 30

  publish:
    # Runs only for a v* tag and only after CI is green; needs the NUGET_API_KEY secret (Mark sets it once).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: artifacts
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
