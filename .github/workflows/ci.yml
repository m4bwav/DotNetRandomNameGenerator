# Build, test and pack on every push and pull request; the .nupkg and .snupkg are kept as a run artifact.
# Publishing to NuGet happens only from a v* tag (see README "Releasing") through nuget.org Trusted Publishing:
# the job trades GitHub's OIDC token for a one-hour NuGet key, so no long-lived API key is stored anywhere.
# It needs a NUGET_USER secret (the nuget.org profile name) in the repository's "nuget" environment.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # SourceLink needs the commit history

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - run: dotnet pack RandomNameGeneratorLibrary --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: artifacts/*nupkg
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write   # lets the job request the GitHub OIDC token that nuget.org exchanges for a temporary key
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: artifacts
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
